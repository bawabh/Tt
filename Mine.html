<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minecraft Mobile Ultra Edition</title>
    
    <!-- إعدادات تطبيق الويب والتثبيت (PWA Capabilities) -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#7ec0ee">
    
    <!-- ربط ملف المانفيست الخارجي -->
    <link rel="manifest" href="manifest.json">

    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background: #000; touch-action: none; }

        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 14px; height: 14px; transform: translate(-50%, -50%);
            pointer-events: none; z-index: 10;
        }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255,255,255,0.8); }
        #crosshair::before { top: 6px; left: 0; width: 14px; height: 2px; }
        #crosshair::after { top: 0; left: 6px; width: 2px; height: 14px; }

        #hotbar {
            position: absolute; bottom: 10px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 4px; background: rgba(0, 0, 0, 0.6);
            padding: 4px; border: 2px solid #444; border-radius: 6px; z-index: 20;
            pointer-events: auto;
        }
        .slot {
            width: 42px; height: 42px; border: 2px solid #666; background: #222;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; position: relative; border-radius: 4px;
        }
        .slot.selected { border-color: #fff; background: #555; transform: scale(1.08); }
        .slot-icon { width: 28px; height: 28px; image-rendering: pixelated; border-radius: 2px; }

        #joystick-zone {
            position: absolute; bottom: 30px; left: 25px;
            width: 110px; height: 110px; background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.4); border-radius: 50%;
            z-index: 20; pointer-events: auto; touch-action: none;
        }
        #joystick-knob {
            position: absolute; top: 50%; left: 50%;
            width: 46px; height: 46px; background: rgba(255, 255, 255, 0.6);
            border-radius: 50%; transform: translate(-50%, -50%);
            pointer-events: none; box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }

        .actions-zone {
            position: absolute; bottom: 30px; right: 20px;
            display: flex; flex-direction: column; gap: 10px;
            z-index: 20; pointer-events: auto;
        }
        .btn-act {
            width: 65px; height: 65px; background: rgba(0,0,0,0.5);
            border: 2px solid rgba(255,255,255,0.7); color: white;
            font-weight: bold; font-size: 15px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            touch-action: manipulation; box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .btn-act:active { background: rgba(255,255,255,0.4); transform: scale(0.95); }

        #look-touch-zone { position: absolute; inset: 0; z-index: 5; touch-action: none; }

        #instructions {
            position: absolute; top: 10px; right: 10px; color: white;
            background: rgba(0,0,0,0.6); padding: 8px 12px; border-radius: 6px;
            font-size: 11px; pointer-events: none; z-index: 20; line-height: 1.5;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="crosshair"></div>
    <div id="look-touch-zone"></div>

    <div id="instructions">
        🕹️ اليسار: الحركة بالجويستيك<br>
        👀 السحب في الشاشة: التدوير والنظر<br>
        👆 ضغطة سريعة: بناء بلوك<br>
        ⏱️ ضغطة مطولة: كسر البلوك
    </div>

    <div id="hotbar">
        <div class="slot selected" data-idx="0"><div class="slot-icon" style="background:#5c8b3d;"></div></div>
        <div class="slot" data-idx="1"><div class="slot-icon" style="background:#866043;"></div></div>
        <div class="slot" data-idx="2"><div class="slot-icon" style="background:#737373;"></div></div>
        <div class="slot" data-idx="3"><div class="slot-icon" style="background:#674a27;"></div></div>
        <div class="slot" data-idx="4"><div class="slot-icon" style="background:#2e6f24;"></div></div>
    </div>

    <div id="joystick-zone"><div id="joystick-knob"></div></div>

    <div class="actions-zone">
        <div class="btn-act" id="btn-jump">قفز</div>
    </div>

    <script>
        // --- 0. تسجيل Service Worker القياسي المباشر ---
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').catch(() => {});
        }

        // --- 1. نظام الصوت المحسن الواقعي (Web Audio API) ---
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const now = audioCtx.currentTime;

            if (type === 'break') {
                const bufferSize = audioCtx.sampleRate * 0.12;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;

                const noise = audioCtx.createBufferSource();
                noise.buffer = buffer;

                const filter = audioCtx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(900, now);
                filter.frequency.exponentialRampToValueAtTime(120, now + 0.12);

                const gain = audioCtx.createGain();
                gain.gain.setValueAtTime(0.5, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(audioCtx.destination);
                noise.start(now);
            } else if (type === 'place') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(260, now);
                osc.frequency.exponentialRampToValueAtTime(70, now + 0.08);

                gain.gain.setValueAtTime(0.4, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'jump') {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.linearRampToValueAtTime(230, now + 0.09);

                gain.gain.setValueAtTime(0.25, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.09);

                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.09);
            }
        }

        // --- 2. بناء الخامات (Pixel Textures) ---
        function createPixelTexture(drawFn) {
            const canvas = document.createElement('canvas');
            canvas.width = 16; canvas.height = 16;
            const ctx = canvas.getContext('2d');
            drawFn(ctx);
            const tex = new THREE.CanvasTexture(canvas);
            tex.magFilter = THREE.NearestFilter;
            tex.minFilter = THREE.NearestFilter;
            return tex;
        }

        const texDirt = createPixelTexture(ctx => {
            ctx.fillStyle = '#866043'; ctx.fillRect(0, 0, 16, 16);
            for(let i=0; i<25; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#6e4c33' : '#9c7353';
                ctx.fillRect(Math.floor(Math.random()*16), Math.floor(Math.random()*16), 2, 2);
            }
        });

        const texGrassTop = createPixelTexture(ctx => {
            ctx.fillStyle = '#5c8b3d'; ctx.fillRect(0, 0, 16, 16);
            for(let i=0; i<25; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#4c7432' : '#6ea34a';
                ctx.fillRect(Math.floor(Math.random()*16), Math.floor(Math.random()*16), 2, 2);
            }
        });

        const texGrassSide = createPixelTexture(ctx => {
            ctx.fillStyle = '#866043'; ctx.fillRect(0, 0, 16, 16);
            ctx.fillStyle = '#5c8b3d'; ctx.fillRect(0, 0, 16, 5);
            for(let x=0; x<16; x+=2) {
                if(Math.random() > 0.3) ctx.fillRect(x, 5, 2, Math.floor(Math.random()*3)+1);
            }
        });

        const texStone = createPixelTexture(ctx => {
            ctx.fillStyle = '#737373'; ctx.fillRect(0, 0, 16, 16);
            for(let i=0; i<30; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#5a5a5a' : '#8c8c8c';
                ctx.fillRect(Math.floor(Math.random()*16), Math.floor(Math.random()*16), 2, 2);
            }
        });

        const texWoodSide = createPixelTexture(ctx => {
            ctx.fillStyle = '#674a27'; ctx.fillRect(0, 0, 16, 16);
            for(let y=0; y<16; y+=4) { ctx.fillStyle = '#4a341a'; ctx.fillRect(0, y, 16, 1); }
        });

        const texWoodTop = createPixelTexture(ctx => {
            ctx.fillStyle = '#a28256'; ctx.fillRect(0, 0, 16, 16);
            ctx.fillStyle = '#674a27'; ctx.strokeRect(2, 2, 12, 12);
        });

        const texLeaves = createPixelTexture(ctx => {
            ctx.fillStyle = '#2e6f24'; ctx.fillRect(0, 0, 16, 16);
            for(let i=0; i<35; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? '#1f4d18' : '#3d8f30';
                ctx.fillRect(Math.floor(Math.random()*16), Math.floor(Math.random()*16), 2, 2);
            }
        });

        const matDirt = new THREE.MeshLambertMaterial({ map: texDirt });
        const matStone = new THREE.MeshLambertMaterial({ map: texStone });
        const matLeaves = new THREE.MeshLambertMaterial({ map: texLeaves, transparent: true, alphaTest: 0.2 });
        const matGrass = [
            new THREE.MeshLambertMaterial({ map: texGrassSide }),
            new THREE.MeshLambertMaterial({ map: texGrassSide }),
            new THREE.MeshLambertMaterial({ map: texGrassTop }),
            new THREE.MeshLambertMaterial({ map: texDirt }),
            new THREE.MeshLambertMaterial({ map: texGrassSide }),
            new THREE.MeshLambertMaterial({ map: texGrassSide })
        ];
        const matWood = [
            new THREE.MeshLambertMaterial({ map: texWoodSide }),
            new THREE.MeshLambertMaterial({ map: texWoodSide }),
            new THREE.MeshLambertMaterial({ map: texWoodTop }),
            new THREE.MeshLambertMaterial({ map: texWoodTop }),
            new THREE.MeshLambertMaterial({ map: texWoodSide }),
            new THREE.MeshLambertMaterial({ map: texWoodSide })
        ];

        const blockTypes = [
            { mat: matGrass, color: 0x5c8b3d },
            { mat: matDirt, color: 0x866043 },
            { mat: matStone, color: 0x737373 },
            { mat: matWood, color: 0x674a27 },
            { mat: matLeaves, color: 0x2e6f24 }
        ];
        let selectedBlockIdx = 0;

        // --- 3. المشهد والكاميرا واليد ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x7ec0ee);
        scene.fog = new THREE.FogExp2(0x7ec0ee, 0.015);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        scene.add(camera);

        const renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.body.appendChild(renderer.domElement);

        const ambLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.55);
        dirLight.position.set(40, 80, 20);
        scene.add(dirLight);

        const handGeo = new THREE.BoxGeometry(0.25, 0.25, 0.25);
        const handMesh = new THREE.Mesh(handGeo, blockTypes[selectedBlockIdx].mat);
        handMesh.position.set(0.35, -0.3, -0.55);
        handMesh.rotation.set(0.2, -0.4, 0);
        camera.add(handMesh);

        let swingTime = 0;
        function triggerSwing() { swingTime = 0.25; }

        // --- 4. غيوم 3D ---
        const cloudGroup = new THREE.Group();
        const cloudMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8 });
        for(let i=0; i<12; i++) {
            const cloud = new THREE.Mesh(new THREE.BoxGeometry(Math.random()*12+8, 2, Math.random()*12+8), cloudMat);
            cloud.position.set((Math.random()-0.5)*80, 18 + Math.random()*4, (Math.random()-0.5)*80);
            cloudGroup.add(cloud);
        }
        scene.add(cloudGroup);

        // --- 5. نظام جزيئات الكسر الذكي (Smart Particles) ---
        const particles = [];
        const pGeo = new THREE.BoxGeometry(0.08, 0.08, 0.08);

        function getBlockColorFromMesh(mesh) {
            if (!mesh || !mesh.material) return 0x888888;
            const mat = Array.isArray(mesh.material) ? mesh.material[0] : mesh.material;

            if (mat === matDirt) return 0x866043;
            if (mat === matStone) return 0x737373;
            if (mat === matLeaves) return 0x2e6f24;
            if (mat === matGrass[0] || mat === matGrass[2]) return 0x5c8b3d;
            if (mat === matWood[0] || mat === matWood[2]) return 0x674a27;

            return 0x888888;
        }

        function spawnBreakParticles(pos, color) {
            const pMat = new THREE.MeshLambertMaterial({ color: color });
            for(let i=0; i<12; i++) {
                const p = new THREE.Mesh(pGeo, pMat);
                p.position.copy(pos).add(new THREE.Vector3((Math.random()-0.5)*0.6, (Math.random()-0.5)*0.6, (Math.random()-0.5)*0.6));
                p.vel = new THREE.Vector3((Math.random()-0.5)*3.5, Math.random()*3 + 1.2, (Math.random()-0.5)*3.5);
                p.life = 0.35;
                scene.add(p);
                particles.push(p);
            }
        }

        // --- 6. الخريطة والبلوكات ---
        const boxGeo = new THREE.BoxGeometry(1, 1, 1);
        const worldMap = new Map();
        const blockMeshList = [];

        function getKey(x, y, z) { return `${x},${y},${z}`; }

        function setBlock(x, y, z, mat) {
            const key = getKey(x, y, z);
            if (worldMap.has(key)) return;
            const mesh = new THREE.Mesh(boxGeo, mat);
            mesh.position.set(x, y, z);
            scene.add(mesh);
            worldMap.set(key, mesh);
            blockMeshList.push(mesh);
        }

        function removeBlockAt(x, y, z) {
            const key = getKey(x, y, z);
            if (!worldMap.has(key)) return;
            const mesh = worldMap.get(key);
            scene.remove(mesh);
            worldMap.delete(key);
            const idx = blockMeshList.indexOf(mesh);
            if (idx > -1) blockMeshList.splice(idx, 1);
        }

        const WORLD_SIZE = 22;
        for (let x = -WORLD_SIZE/2; x < WORLD_SIZE/2; x++) {
            for (let z = -WORLD_SIZE/2; z < WORLD_SIZE/2; z++) {
                const h = Math.floor(Math.sin(x*0.25) * Math.cos(z*0.25) * 2);
                setBlock(x, h, z, matGrass);
                setBlock(x, h - 1, z, matDirt);
                setBlock(x, h - 2, z, matStone);

                if (Math.random() < 0.025 && Math.abs(x) > 2 && Math.abs(z) > 2) {
                    for (let ty = 1; ty <= 4; ty++) setBlock(x, h + ty, z, matWood);
                    for (let lx = -1; lx <= 1; lx++) {
                        for (let lz = -1; lz <= 1; lz++) {
                            for (let ly = 4; ly <= 5; ly++) {
                                if (lx === 0 && lz === 0 && ly === 4) continue;
                                setBlock(x + lx, h + ly, z + lz, matLeaves);
                            }
                        }
                    }
                }
            }
        }

        const targetOutline = new THREE.LineSegments(
            new THREE.EdgesGeometry(new THREE.BoxGeometry(1.005, 1.005, 1.005)),
            new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2 })
        );
        targetOutline.visible = false;
        scene.add(targetOutline);

        // --- 7. إعدادات اللاعب والفيزياء الدقيقة ---
        const player = {
            pos: new THREE.Vector3(0, 5, 0),
            vel: new THREE.Vector3(0, 0, 0),
            rot: new THREE.Euler(0, 0, 0, 'YXZ'),
            radius: 0.32,
            height: 1.65,
            onGround: false
        };

        function isCollidingAt(pos) {
            const pMinX = pos.x - player.radius;
            const pMaxX = pos.x + player.radius;
            const pMinY = pos.y - player.height;
            const pMaxY = pos.y - 0.05;
            const pMinZ = pos.z - player.radius;
            const pMaxZ = pos.z + player.radius;

            const minX = Math.round(pMinX);
            const maxX = Math.round(pMaxX);
            const minY = Math.round(pMinY);
            const maxY = Math.round(pMaxY);
            const minZ = Math.round(pMinZ);
            const maxZ = Math.round(pMaxZ);

            for (let x = minX; x <= maxX; x++) {
                for (let y = minY; y <= maxY; y++) {
                    for (let z = minZ; z <= maxZ; z++) {
                        if (worldMap.has(getKey(x, y, z))) {
                            const bMinX = x - 0.5, bMaxX = x + 0.5;
                            const bMinY = y - 0.5, bMaxY = y + 0.5;
                            const bMinZ = z - 0.5, bMaxZ = z + 0.5;

                            const overlapX = pMinX < bMaxX && pMaxX > bMinX;
                            const overlapY = pMinY < bMaxY && pMaxY > bMinY;
                            const overlapZ = pMinZ < bMaxZ && pMaxZ > bMinZ;

                            if (overlapX && overlapY && overlapZ) return true;
                        }
                    }
                }
            }
            return false;
        }

        // --- 8. التحكم للجويستيك واللمس المتقدم ---
        let joyVector = { x: 0, y: 0 };
        const joyZone = document.getElementById('joystick-zone');
        const joyKnob = document.getElementById('joystick-knob');
        let joyTouchId = null;

        function handleJoystick(touch) {
            const rect = joyZone.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            const maxRadius = rect.width / 2;
            const dist = Math.hypot(dx, dy);

            if (dist > maxRadius) {
                dx = (dx / dist) * maxRadius;
                dy = (dy / dist) * maxRadius;
            }
            joyKnob.style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
            joyVector.x = dx / maxRadius;
            joyVector.y = -dy / maxRadius;
        }

        joyZone.addEventListener('touchstart', (e) => {
            e.preventDefault(); e.stopPropagation();
            const touch = e.changedTouches[0];
            joyTouchId = touch.identifier;
            handleJoystick(touch);
        });

        window.addEventListener('touchmove', (e) => {
            for (let t of e.changedTouches) {
                if (t.identifier === joyTouchId) handleJoystick(t);
            }
        });

        const resetJoystick = () => {
            joyVector.x = 0; joyVector.y = 0;
            joyKnob.style.transform = 'translate(-50%, -50%)';
            joyTouchId = null;
        };
        window.addEventListener('touchend', (e) => {
            for (let t of e.changedTouches) {
                if (t.identifier === joyTouchId) resetJoystick();
            }
        });

        // --- 9. تحكم البناء بالنقرة المباشرة والكسر بالضغط المطول ---
        const raycaster = new THREE.Raycaster();
        raycaster.far = 6;
        const centerVec = new THREE.Vector2(0, 0);

        function getTarget() {
            raycaster.setFromCamera(centerVec, camera);
            const intersects = raycaster.intersectObjects(blockMeshList);
            return intersects.length > 0 ? intersects[0] : null;
        }

        function breakTargetBlock() {
            const hit = getTarget();
            if (hit) {
                triggerSwing();
                const pos = hit.object.position;
                const smartColor = getBlockColorFromMesh(hit.object);
                spawnBreakParticles(pos, smartColor);
                removeBlockAt(pos.x, pos.y, pos.z);
                playSound('break');
            }
        }

        function buildTargetBlock() {
            const hit = getTarget();
            if (hit) {
                const p = hit.object.position.clone().add(hit.face.normal);
                const pMin = player.pos.clone().sub(new THREE.Vector3(player.radius, player.height, player.radius));
                const pMax = player.pos.clone().add(new THREE.Vector3(player.radius, 0, player.radius));
                const bMin = p.clone().sub(new THREE.Vector3(0.5, 0.5, 0.5));
                const bMax = p.clone().add(new THREE.Vector3(0.5, 0.5, 0.5));

                const overlap = (pMin.x < bMax.x && pMax.x > bMin.x) &&
                                (pMin.y < bMax.y && pMax.y > bMin.y) &&
                                (pMin.z < bMax.z && pMax.z > bMin.z);

                if (!overlap) {
                    triggerSwing();
                    setBlock(p.x, p.y, p.z, blockTypes[selectedBlockIdx].mat);
                    playSound('place');
                }
            }
        }

        let lookTouchId = null;
        let startTouchX = 0, startTouchY = 0;
        let lastTouchX = 0, lastTouchY = 0;
        let touchStartTime = 0;
        let holdTimer = null;
        let isHoldTriggered = false;
        let isMovedSignificantly = false;

        const lookZone = document.getElementById('look-touch-zone');

        lookZone.addEventListener('touchstart', (e) => {
            if (e.target.closest('#hotbar') || e.target.closest('.actions-zone')) return;
            const t = e.changedTouches[0];
            lookTouchId = t.identifier;
            startTouchX = t.clientX; startTouchY = t.clientY;
            lastTouchX = t.clientX; lastTouchY = t.clientY;
            touchStartTime = performance.now();
            isHoldTriggered = false;
            isMovedSignificantly = false;

            holdTimer = setTimeout(() => {
                if (!isMovedSignificantly) {
                    isHoldTriggered = true;
                    breakTargetBlock();
                }
            }, 350);
        });

        window.addEventListener('touchmove', (e) => {
            for (let t of e.changedTouches) {
                if (t.identifier === lookTouchId) {
                    const dx = t.clientX - lastTouchX;
                    const dy = t.clientY - lastTouchY;
                    const totalDist = Math.hypot(t.clientX - startTouchX, t.clientY - startTouchY);

                    if (totalDist > 10) {
                        isMovedSignificantly = true;
                        clearTimeout(holdTimer);
                    }

                    player.rot.y -= dx * 0.004;
                    player.rot.x -= dy * 0.004;
                    player.rot.x = Math.max(-Math.PI/2 + 0.05, Math.min(Math.PI/2 - 0.05, player.rot.x));
                    lastTouchX = t.clientX; lastTouchY = t.clientY;
                }
            }
        });

        window.addEventListener('touchend', (e) => {
            for (let t of e.changedTouches) {
                if (t.identifier === lookTouchId) {
                    clearTimeout(holdTimer);
                    if (!isMovedSignificantly && !isHoldTriggered && (performance.now() - touchStartTime < 350)) {
                        buildTargetBlock();
                    }
                    lookTouchId = null;
                }
            }
        });

        // --- 10. أزرار الحركة والـ Hotbar ---
        const jumpBtn = document.getElementById('btn-jump');
        const doJump = (e) => {
            if (e) { e.preventDefault(); e.stopPropagation(); }
            if (player.onGround) {
                player.vel.y = 7.5;
                player.onGround = false;
                playSound('jump');
            }
        };
        jumpBtn.addEventListener('touchstart', doJump);
        jumpBtn.addEventListener('mousedown', doJump);

        document.querySelectorAll('.slot').forEach(s => {
            s.addEventListener('click', (e) => {
                e.stopPropagation();
                document.querySelectorAll('.slot').forEach(slot => slot.classList.remove('selected'));
                s.classList.add('selected');
                selectedBlockIdx = parseInt(s.dataset.idx);
                handMesh.material = blockTypes[selectedBlockIdx].mat;
            });
        });

        // --- 11. حلقة التحديث العامة (Game Loop) ---
        let lastTime = performance.now();

        function animate() {
            requestAnimationFrame(animate);
            const now = performance.now();
            const dt = Math.min((now - lastTime) / 1000, 0.08);
            lastTime = now;

            // أ) حركة الجويستيك
            const speed = 5.0;
            if (Math.abs(joyVector.x) > 0.05 || Math.abs(joyVector.y) > 0.05) {
                const localMove = new THREE.Vector3(joyVector.x, 0, -joyVector.y).normalize();
                localMove.applyAxisAngle(new THREE.Vector3(0, 1, 0), player.rot.y);

                const nextX = player.pos.clone(); nextX.x += localMove.x * speed * dt;
                if (!isCollidingAt(nextX)) player.pos.x = nextX.x;

                const nextZ = player.pos.clone(); nextZ.z += localMove.z * speed * dt;
                if (!isCollidingAt(nextZ)) player.pos.z = nextZ.z;
            }

            // ب) الجاذبية
            player.vel.y -= 22.0 * dt;
            const nextY = player.pos.clone(); nextY.y += player.vel.y * dt;

            if (isCollidingAt(nextY)) {
                if (player.vel.y < 0) player.onGround = true;
                player.vel.y = 0;
            } else {
                player.pos.y = nextY.y;
                player.onGround = false;
            }

            if (player.pos.y < -15) { player.pos.set(0, 8, 0); player.vel.set(0, 0, 0); }

            // ج) انيميشن حركة اليد
            if (swingTime > 0) {
                swingTime -= dt;
                handMesh.position.z = -0.55 + Math.sin(swingTime * Math.PI * 4) * 0.1;
                handMesh.rotation.x = 0.2 + Math.sin(swingTime * Math.PI * 4) * 0.4;
            } else {
                handMesh.position.set(0.35, -0.3, -0.55);
                handMesh.rotation.set(0.2, -0.4, 0);
            }

            // د) تحريك الجزيئات
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.life -= dt;
                p.vel.y -= 15.0 * dt;
                p.position.addScaledVector(p.vel, dt);
                if (p.life <= 0) {
                    scene.remove(p);
                    particles.splice(i, 1);
                }
            }

            // هـ) تحريك الغيوم
            cloudGroup.children.forEach(c => {
                c.position.x += 0.8 * dt;
                if (c.position.x > 50) c.position.x = -50;
            });

            // و) تحديث الكاميرا والمستهدف
            camera.position.copy(player.pos);
            camera.rotation.copy(player.rot);

            const hit = getTarget();
            if (hit) {
                targetOutline.position.copy(hit.object.position);
                targetOutline.visible = true;
            } else {
                targetOutline.visible = false;
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
